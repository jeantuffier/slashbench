[package]
name = "slashbench"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
anyhow = "1"
chrono = "0.4"
askama = "0.16"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
strip = true
