      DATABASE_URL: postgres://slashbench:slashbench@postgres:5432/slashbench
      LD_PRELOAD: /app/listen_override.so
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  spring-java:
    build: ./services/spring-java
    image: rg.fr-par.scw.cloud/slashbench/spring-java:latest
    platform: linux/amd64
    profiles: ["spring-java"]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  spring-kotlin:
    build: ./services/spring-kotlin
    image: rg.fr-par.scw.cloud/slashbench/spring-kotlin:latest
    platform: linux/amd64
    profiles: ["spring-kotlin"]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  node-hono:
    build: ./services/node-hono
    image: rg.fr-par.scw.cloud/slashbench/node-hono:latest
    platform: linux/amd64
    profiles: ["node-hono"]
    environment:
      DATABASE_URL: postgres://slashbench:slashbench@postgres:5432/slashbench
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  bun-hono:
    build: ./services/bun-hono
    image: rg.fr-par.scw.cloud/slashbench/bun-hono:latest
