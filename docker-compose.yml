services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: slashbench
      POSTGRES_PASSWORD: slashbench
      POSTGRES_DB: slashbench
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slashbench"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SLASHBENCH_POSTGRES_HOST defaults to the local compose service name
  # ("postgres") for single-machine dev, unchanged. For the official
  # multi-VM run it's set to the dedicated slashbench-postgres VM's IP, so
  # Postgres's CPU doesn't share a host with (and confound) the app
  # container's own measured CPU/memory — see CLAUDE.md's Aug 19 diagnostic.
  # No depends_on for postgres: it may now live on a different host than the
  # app container entirely (docker compose can't manage a cross-host health
  # dependency), so the CLI's own ensure_postgres()/wait_http_ready() calls
  # are the real readiness gate instead.
  rocket:
    build: ./services/rocket
    image: rg.fr-par.scw.cloud/slashbench/rocket:latest
    platform: linux/amd64
    profiles: ["rocket"]
    environment:
      DATABASE_URL: postgres://slashbench:slashbench@${SLASHBENCH_POSTGRES_HOST:-postgres}:5432/slashbench
      LD_PRELOAD: /app/listen_override.so
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "8080:8080"

  actix-web:
    build: ./services/actix-web
    image: rg.fr-par.scw.cloud/slashbench/actix-web:latest
    platform: linux/amd64
    profiles: ["actix-web"]
    environment:
      DATABASE_URL: postgres://slashbench:slashbench@${SLASHBENCH_POSTGRES_HOST:-postgres}:5432/slashbench
      LD_PRELOAD: /app/listen_override.so
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "8080:8080"

  spring-java:
    build: ./services/spring-java
    image: rg.fr-par.scw.cloud/slashbench/spring-java:latest
    platform: linux/amd64
    profiles: ["spring-java"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${SLASHBENCH_POSTGRES_HOST:-postgres}:5432/slashbench
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "8080:8080"

  spring-kotlin:
    build: ./services/spring-kotlin
    image: rg.fr-par.scw.cloud/slashbench/spring-kotlin:latest
    platform: linux/amd64
    profiles: ["spring-kotlin"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${SLASHBENCH_POSTGRES_HOST:-postgres}:5432/slashbench
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "8080:8080"

  node-hono:
    build: ./services/node-hono
    image: rg.fr-par.scw.cloud/slashbench/node-hono:latest
    platform: linux/amd64
    profiles: ["node-hono"]
    environment:
      DATABASE_URL: postgres://slashbench:slashbench@${SLASHBENCH_POSTGRES_HOST:-postgres}:5432/slashbench
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "8080:8080"

  bun-hono:
    build: ./services/bun-hono
    image: rg.fr-par.scw.cloud/slashbench/bun-hono:latest
    platform: linux/amd64
    profiles: ["bun-hono"]
    environment:
      DATABASE_URL: postgres://slashbench:slashbench@${SLASHBENCH_POSTGRES_HOST:-postgres}:5432/slashbench
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "8080:8080"
